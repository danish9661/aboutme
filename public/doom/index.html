<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DOOM (1993) - WebAssembly Edition</title>
  <!--
    js-dos v6.22.60 — loaded from CDN so the exact matching wdosbox.wasm.js
    is always served. IndexedDB cache is keyed on the build version string,
    so CDN + local wasm binary stay in sync.
  -->
  <script src="https://cdn.jsdelivr.net/npm/js-dos@6.22.60/dist/js-dos.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      color: #ff4e9b;
      font-family: monospace;
      overflow: hidden;
    }
    #dos {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .dosbox-container {
      width: 100% !important;
      height: 100% !important;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      background: #000;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 5, 16, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 78, 155, 0.2);
      border-top-color: #ff4e9b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 12px;
      color: #e7f0f9;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="status-text" id="status">Loading DOOM WASM Engine &amp; Assets...</div>
  </div>
  <canvas id="dos" tabindex="1" autofocus></canvas>

  <script>
    /*
     * Override Emscripten's locateFile so it fetches WASM from our local
     * /doom/ directory instead of trying to resolve relative to js-dos CDN.
     * This is the standard Emscripten pattern for self-hosting wasm binaries.
     */
    window.Module = {
      locateFile: function(path) {
        return '/doom/' + path;
      }
    };

    // Cache-bust version to force fresh WASM binary download (bypasses IndexedDB stale cache)
    var CB = "?v=20260819";

    var canvas = document.getElementById("dos");
    
    // Ensure canvas stays focused for keyboard control
    function focusCanvas() {
      if (canvas) {
        canvas.focus();
      }
    }
    window.addEventListener("click", focusCanvas);
    window.addEventListener("keydown", function(e) {
      // Prevent page scrolling when using arrow keys / space in the game
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", " "].indexOf(e.key) >= 0) {
        e.preventDefault();
      }
    });

    Dos(canvas, {
      wdosboxUrl: "/doom/wdosbox.js" + CB,
      cycles: "max",
      autolock: true,
      onprogress: function(stage, total, loaded) {
        var status = document.getElementById("status");
        if (status) {
          var pct = total > 0 ? Math.round((loaded / total) * 100) : 0;
          status.innerText = stage + " (" + pct + "%)...";
        }
      }
    }).ready(function(fs, main) {
      fs.extract("/doom/doom.jsdos" + CB).then(function() {
        var overlay = document.getElementById("loading-overlay");
        if (overlay) {
          overlay.style.opacity = "0";
          setTimeout(function() { overlay.style.display = "none"; }, 300);
        }
        main(["-c", "DOOM.EXE"]).then(function(ci) {
          focusCanvas();
          if (ci && ci.simulateKeyPress) {
            // Send initial enter to skip demo screen if needed
            setTimeout(focusCanvas, 500);
          }
        });
      });
    });
  </script>
</body>
</html>
